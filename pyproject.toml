[project]
name = "portshield-ai"
version = "0.1.0"
description = "Synthetic reference prototype for sovereign port and logistics resilience analysis"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
portshield = "portshield.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["portshield*"]
