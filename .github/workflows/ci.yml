name: public-synthetic-ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python }}'}
      - run: pip install -e '.[dev,toy]'
      - run: ruff check src tests scripts experiments
      - run: portshield-ai generate && pytest -q
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_publication.py
      - run: python -m build
      - run: docker build -f docker/Dockerfile -t portshield-ci .
  # GPU model quality/serving checks are operator-run; no public credentials or operational data.
